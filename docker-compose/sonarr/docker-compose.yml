services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=100
      - TZ=Etc/UTC+1
    volumes:
      - /home/corum/.docker/sonarr/data:/config
      - /mnt/pool/Serien:/tv #optional
      - /mnt/pool/Downloads/Serien:/downloads #optional
    ports:
      - 8989:8989
    restart: unless-stopped